name: Alpha Data Probe

on:
  push:
    paths:
      - '.github/workflows/alpha-data-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download candidate cross-sectional dataset
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail \
            https://raw.githubusercontent.com/ss6708/Stock-Analyzer-Graphing-Tool/main/sp500_stocks.csv \
            -o /tmp/sp500_stocks.csv

      - name: Build clean long panel
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from datetime import datetime
          rows=[]
          counts=Counter()
          with open('/tmp/sp500_stocks.csv', newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              for x in r:
                  try:
                      if not x.get('Date') or not x.get('Symbol') or not x.get('Close') or not x.get('Volume'):
                          continue
                      dt=datetime.strptime(x['Date'],'%m/%d/%Y').date().isoformat()
                      close=float(x['Close']); volume=float(x['Volume'])
                      if close<=0 or volume<0:
                          continue
                  except Exception:
                      continue
                  sym=x['Symbol'].strip()
                  rows.append((dt,sym,close,volume))
                  counts[sym]+=1
          keep={s for s,n in counts.items() if n>=180}
          rows=[z for z in rows if z[1] in keep]
          rows.sort(key=lambda z:(z[0],z[1]))
          with open('/tmp/market.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(['date','asset','close','volume'])
              w.writerows(rows)
          dates={z[0] for z in rows}
          print('CLEAN_ROWS',len(rows))
          print('ASSETS',len(keep))
          print('DATES',len(dates))
          print('DATE_MIN',min(dates) if dates else None)
          print('DATE_MAX',max(dates) if dates else None)
          print('TOP_COUNTS',counts.most_common(20))
          print('FIRST_ROWS',rows[:5])
          PY

      - name: Upload cleaned panel
        uses: actions/upload-artifact@v4
        with:
          name: alpha-market-panel
          path: /tmp/market.csv
          retention-days: 1
