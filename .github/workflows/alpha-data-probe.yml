name: Alpha Data Probe

on:
  push:
    paths:
      - '.github/workflows/alpha-data-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download candidate cross-sectional dataset
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail \
            https://raw.githubusercontent.com/ss6708/Stock-Analyzer-Graphing-Tool/main/sp500_stocks.csv \
            -o /tmp/sp500_stocks.csv

      - name: Build clean long panel
        run: |
          python - <<'PY'
          import pandas as pd
          p='/tmp/sp500_stocks.csv'
          df=pd.read_csv(p)
          df['Date']=pd.to_datetime(df['Date'], errors='coerce')
          for c in ['Close','Volume']:
              df[c]=pd.to_numeric(df[c], errors='coerce')
          df=df.dropna(subset=['Date','Symbol','Close','Volume']).copy()
          df=df[df['Close']>0]
          df=df[df['Volume']>=0]
          counts=df.groupby('Symbol')['Date'].nunique().sort_values(ascending=False)
          keep=counts[counts>=180].index
          df=df[df['Symbol'].isin(keep)]
          out=df[['Date','Symbol','Close','Volume']].rename(columns={'Date':'date','Symbol':'asset','Close':'close','Volume':'volume'})
          out=out.sort_values(['date','asset'])
          out.to_csv('/tmp/market.csv',index=False)
          print('CLEAN_ROWS',len(out))
          print('ASSETS',out['asset'].nunique())
          print('DATES',out['date'].nunique())
          print('DATE_MIN',out['date'].min())
          print('DATE_MAX',out['date'].max())
          print('TOP_COUNTS')
          print(counts.head(20).to_string())
          print(out.head().to_string(index=False))
          PY

      - name: Upload cleaned panel
        uses: actions/upload-artifact@v4
        with:
          name: alpha-market-panel
          path: /tmp/market.csv
          retention-days: 1
